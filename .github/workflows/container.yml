name: Container

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, pyproject.toml, uv.lock, "src/**", alembic.ini, "data/dictionary/**"]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build, smoke test, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fact-ledger:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (health endpoint, non-root)
        run: |
          docker run -d --name app -p 8000:8000 fact-ledger:scan
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec app id -u)" != "0"
          docker exec app alembic upgrade head
          docker exec app fact-ledger metrics undefined
          docker rm -f app
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fact-ledger:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
