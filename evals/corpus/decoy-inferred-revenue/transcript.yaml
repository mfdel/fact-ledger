# Synthetic corpus case. No real company data.
#
# Decoy. The p2 "Revenue" series matches recognised revenue
# in 2024 and 2023, so the report reads it as recognised revenue. 2022 inherits the reading. No
# flag: the reading is an assumption, not an error.
#
# Base: clean-nimbus (see manifest.yaml). This file holds only the rows that the case adds
# or replaces. A row replaces the base row with the same observation_id.
defaults: {entity_id: nimbus, origin_id: nimbus-management, document_id: nimbus-deck-2025,
           source_type: deck, reliability: 4, bias_direction: up, published_date: 2025-03-01,
           unit: EUR, currency: EUR}
observations:
  - {observation_id: nimbus-21, metric_id: revenue_unspecified, value: "4650000",
     stated_precision: "5000", period_start: 2023-01-01, period_end: 2023-12-31, period_type: fy,
     as_of_date: 2023-12-31, locator: "p2 executive summary", stated_label: "Revenue",
     definition_status: ambiguous, candidate_metric_ids: [revenue_recognised, arr]}  # printed "€4.65m"
  - {observation_id: nimbus-12, metric_id: revenue_unspecified, value: "6950000",
     stated_precision: "50000", period_start: 2024-01-01, period_end: 2024-12-31,
     period_type: fy, as_of_date: 2024-12-31, locator: "p2 executive summary",
     stated_label: "Revenue", definition_status: ambiguous,
