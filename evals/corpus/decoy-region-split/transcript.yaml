# Synthetic corpus case. No real company data.
#
# Decoy only. Story S3-12, criterion 1: one metric, one period, three
# regions and the group. The four values differ, and they are four facts, not one fact with
# four readings. A region value never compares with another region or with the group, so the
# validator must raise no finding here. Without the region qualifier the four rows give one
# divergence, so this case fails when the qualifier is lost.
#
# The last two rows hold the other half of the rule: two rows that share every qualifier stay
# one fact. The press row repeats the group value from a second origin, so it corroborates.
defaults: {entity_id: helix, origin_id: helix-management, document_id: helix-deck-2025,
           source_type: deck, reliability: 4, bias_direction: up, published_date: 2025-03-01,
           unit: EUR, currency: EUR}
observations:
