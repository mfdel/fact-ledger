     period_start: 2024-12-31, period_end: 2024-12-31, period_type: point_in_time,
     as_of_date: 2024-12-31, locator: "p4", stated_label: "ARR",
     region: "EMEA"}  # printed "EMEA ARR  120.0" under "ARR by region (€m)"
