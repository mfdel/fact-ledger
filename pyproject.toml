[project]
name = "fact-ledger"
version = "0.1.0"
description = "Pre-Valuation Intelligence Layer: an auditable fact base about a target company, and the checks that interrogate it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Fuat Deligöz" }]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "litellm>=1.102.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.19",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2.0.36",
    "typer>=0.15",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
fact-ledger = "fact_ledger.cli:app"

[dependency-groups]
dev = [
    "codespell>=2.3",
    "commitizen>=4.1",
    "httpx2>=2.13.0",
    "hypothesis>=6.120",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
    "vulture>=2.16",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fact_ledger"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "scripts", "tests", "evals"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "N", "PT", "TID", "ANN", "C4", "PL",
    "DTZ",  # dates are core to the data model: no naive datetimes
    "ERA", "RET", "PIE", "FURB",  # slim code: no commented-out code, no redundant constructs
]
ignore = [
    "PLR0913",  # too many arguments: domain constructors are wide by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN"]
"evals/**" = ["S101"]
"src/fact_ledger/store/migrations/**" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["fact_ledger", "evals", "tests", "slim_check"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
mypy_path = ["src", "scripts"]
files = ["src", "scripts", "tests", "evals"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["vulture"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]  # ships py.typed but is huge; skip it to keep mypy fast
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "evals"]
pythonpath = ["scripts", "."]
addopts = ["--strict-markers", "--strict-config", "-ra", "-m", "not slow"]
markers = [
    "unit: fast, no IO",
    "property: hypothesis property tests",
    "integration: touches DB, HTTP app or filesystem",
    "eval: seeded-error evaluation",
    "slow: longer than one second",
]
filterwarnings = [
    "error",
    # third-party: starlette.testclient still uses the old anyio alias
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["fact_ledger", "slim_check"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "fact_ledger"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: cli > app > api|web > extract > store|llm > domain"
type = "layers"
layers = [
    "fact_ledger.cli",
    "fact_ledger.app",
    "fact_ledger.api | fact_ledger.web",
    "fact_ledger.extract",
    "fact_ledger.store | fact_ledger.llm",
    "fact_ledger.domain",
]

[[tool.importlinter.contracts]]
name = "Domain is pure: no IO or framework imports"
type = "forbidden"
source_modules = ["fact_ledger.domain"]
forbidden_modules = ["sqlalchemy", "alembic", "fastapi", "starlette", "jinja2", "httpx", "typer"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the store reads or writes YAML files"
type = "forbidden"
source_modules = ["fact_ledger.cli", "fact_ledger.app", "fact_ledger.api", "fact_ledger.web", "fact_ledger.domain", "fact_ledger.extract", "fact_ledger.llm"]
forbidden_modules = ["ruamel", "yaml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only the llm module imports LiteLLM"
type = "forbidden"
source_modules = ["fact_ledger.cli", "fact_ledger.app", "fact_ledger.api", "fact_ledger.web", "fact_ledger.extract", "fact_ledger.store", "fact_ledger.domain"]
forbidden_modules = ["litellm"]
allow_indirect_imports = true

# ---------------------------------------------------------------- commitizen
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"
tag_format = "v$version"

# ---------------------------------------------------------------- codespell
[tool.codespell]
skip = "./uv.lock,*.svg,*.pdf,./docs/fact_ledger_architecture_*.md,./.venv,./.git"
ignore-words-list = "ser,hist"
